<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15191F" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Level</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('level-theme') || 'auto';
          var light = pref === 'light' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', light ? '#F5F1E8' : '#15191F');
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
